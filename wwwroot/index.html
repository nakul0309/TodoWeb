<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Todo List</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #1f2937;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,.25);
  }
  h1 { font-size: 28px; font-weight: 700; }
  .subtitle { color: #6b7280; font-size: 14px; margin: 4px 0 24px; }

  .add-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .add-row input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .add-row input:focus { border-color: #667eea; }
  .add-row button {
    padding: 0 22px;
    border: none;
    border-radius: 12px;
    background: #667eea;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .add-row button:hover { background: #5a67d8; }
  .add-row button:active { transform: scale(.96); }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters button {
    padding: 6px 14px;
    border: none;
    border-radius: 999px;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .filters button.active { background: #667eea; color: #fff; }

  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 12px;
    border-radius: 12px;
    transition: background .15s;
    animation: pop .25s ease;
  }
  li:hover { background: #f9fafb; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .check {
    width: 24px; height: 24px;
    border: 2px solid #d1d5db;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 14px;
    transition: all .2s;
  }
  .check:hover { border-color: #667eea; }
  li.done .check { background: #10b981; border-color: #10b981; color: #fff; }

  .title { flex: 1; font-size: 15px; word-break: break-word; }
  li.done .title { text-decoration: line-through; color: #9ca3af; }

  .delete {
    border: none; background: none;
    color: #d1d5db; font-size: 18px;
    cursor: pointer;
    opacity: 0;
    transition: color .2s, opacity .2s;
  }
  li:hover .delete { opacity: 1; }
  .delete:hover { color: #ef4444; }

  .empty { text-align: center; color: #9ca3af; padding: 32px 0; font-size: 14px; }
  .footer {
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid #f3f4f6;
    color: #6b7280; font-size: 13px;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ My Tasks</h1>
    <p class="subtitle" id="today"></p>

    <div class="add-row">
      <input id="newTitle" placeholder="What needs to be done?" autofocus>
      <button id="addBtn">Add</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <div class="footer">
      <span id="count"></span>
      <span>Built with .NET</span>
    </div>
  </div>

<script>
  let todos = [];
  let filter = 'all';

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  async function load() {
    const res = await fetch('/api/todos');
    todos = await res.json();
    render();
  }

  function render() {
    const list = document.getElementById('list');
    const shown = todos.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.isDone : !t.isDone);

    if (shown.length === 0) {
      list.innerHTML = '<div class="empty">Nothing here yet ✨</div>';
    } else {
      list.innerHTML = shown.map(t => `
        <li class="${t.isDone ? 'done' : ''}">
          <div class="check" onclick="toggle(${t.id})">✓</div>
          <span class="title">${escapeHtml(t.title)}</span>
          <button class="delete" onclick="remove(${t.id})" title="Delete">✕</button>
        </li>`).join('');
    }
    const left = todos.filter(t => !t.isDone).length;
    document.getElementById('count').textContent = `${left} task${left === 1 ? '' : 's'} left`;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function add() {
    const input = document.getElementById('newTitle');
    const title = input.value.trim();
    if (!title) return;
    await fetch('/api/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    input.value = '';
    load();
  }

  async function toggle(id) { await fetch(`/api/todos/${id}/toggle`, { method: 'PUT' }); load(); }
  async function remove(id) { await fetch(`/api/todos/${id}`, { method: 'DELETE' }); load(); }

  document.getElementById('addBtn').onclick = add;
  document.getElementById('newTitle').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.filter;
    render();
  });

  load();
</script>
</body>
</html>
